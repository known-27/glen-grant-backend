<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submissions — The Glen Grant Admin</title>
  <meta name="description" content="Browse, search, and filter all bartender submissions." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96B;
      --gold-dim: rgba(201,168,76,0.15);
      --dark: #0A0A0F;
      --dark-2: #111118;
      --dark-3: #1A1A28;
      --dark-4: #22223A;
      --card: rgba(26,26,40,0.9);
      --text: #F0EDE8;
      --text-muted: #9896A4;
      --text-dim: #6B6978;
      --border: rgba(201,168,76,0.15);
      --border-dim: rgba(255,255,255,0.06);
      --success: #4CAF82;
      --error: #FF6B6B;
      --info: #6BA4FF;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark-2); }
    ::-webkit-scrollbar-thumb { background: var(--dark-4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* ── Sidebar (shared) ── */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 240px;
      background: var(--dark-2);
      border-right: 1px solid var(--border-dim);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .sidebar-brand { padding: 28px 24px 24px; border-bottom: 1px solid var(--border-dim); }
    .sidebar-brand .icon { font-size: 28px; margin-bottom: 10px; display: block; }
    .sidebar-brand h2 { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: var(--gold-light); }
    .sidebar-brand p { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
    .sidebar-nav { flex: 1; padding: 16px 12px; }
    .nav-section-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; padding: 0 12px; margin-bottom: 6px; margin-top: 16px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); text-decoration: none; cursor: pointer; transition: background 0.15s, color 0.15s; border: none; background: none; width: 100%; text-align: left; font-family: 'Inter', sans-serif; }
    .nav-link:hover { background: var(--gold-dim); color: var(--gold-light); }
    .nav-link.active { background: var(--gold-dim); color: var(--gold); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-dim); }
    .btn-logout { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); border-radius: 8px; font-size: 0.85rem; color: var(--error); cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; transition: background 0.15s; }
    .btn-logout:hover { background: rgba(255,107,107,0.15); }

    /* ── Main ── */
    .main { margin-left: 240px; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-dim); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; z-index: 50; }
    .topbar-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .topbar-meta { font-size: 0.8rem; color: var(--text-muted); }

    .page-content { flex: 1; padding: 32px; }

    /* ── Filters ── */
    .filters-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 14px;
      align-items: end;
    }

    .filter-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 7px;
    }

    .filter-group input,
    .filter-group select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    .filter-group select option { background: var(--dark-3); }

    .filters-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 18px;
      border-radius: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary { background: linear-gradient(135deg, var(--gold), #B8912A); color: var(--dark); }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary { background: var(--dark-3); color: var(--text); border: 1px solid var(--border-dim); }
    .btn-secondary:hover { background: var(--dark-4); border-color: var(--gold); color: var(--gold-light); }

    /* ── Table ── */
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-title { font-size: 1rem; font-weight: 600; }
    .table-count { font-size: 0.8rem; color: var(--text-muted); }

    .table-wrap { overflow-x: auto; }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    .data-table th {
      padding: 12px 16px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: left;
      border-bottom: 1px solid var(--border-dim);
      background: rgba(0,0,0,0.2);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .data-table th:hover { color: var(--gold); }

    .data-table td {
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      vertical-align: middle;
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(201,168,76,0.04); }

    .testimonial-cell {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .ig-handle { color: var(--info); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-direct { background: rgba(76,175,130,0.15); color: var(--success); }
    .badge-synced { background: rgba(107,164,255,0.15); color: var(--info); }

    .sig-thumb {
      width: 70px;
      height: 35px;
      object-fit: contain;
      border-radius: 4px;
      border: 1px solid var(--border-dim);
      background: white;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .sig-thumb:hover {
      transform: scale(2.5);
      z-index: 10;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-top: 1px solid var(--border-dim);
    }

    .pagination-info {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .pagination-controls {
      display: flex;
      gap: 6px;
    }

    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: 1px solid var(--border-dim);
      background: var(--dark-3);
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .page-btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .page-btn.active { background: var(--gold); color: var(--dark); border-color: var(--gold); font-weight: 700; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Empty / Loading ── */
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px; color: var(--text-muted); font-size: 0.875rem; }

    /* ── Modal (full signature view) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--dark-3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.open .modal { transform: scale(1); }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--gold-light); }

    .modal-close {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 18px;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .modal-close:hover { background: rgba(255,107,107,0.2); color: var(--error); }

    .modal-sig-img { width: 100%; border-radius: 10px; background: white; padding: 8px; }

    .modal-field { margin-bottom: 14px; }
    .modal-field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 4px; }
    .modal-field-value { font-size: 0.9rem; color: var(--text); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--dark-3); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: 0.875rem; color: var(--text); z-index: 1000; opacity: 0; transform: translateY(10px); transition: all 0.3s; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .page-content { padding: 20px 16px; }
      .filters-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="icon">🥃</span>
      <h2>The Glen Grant</h2>
      <p>Bartender Notes</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Navigation</div>
      <a href="/admin" class="nav-link">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a href="/admin/submissions" class="nav-link active">
        <span class="nav-icon">📋</span> All Submissions
      </a>
      <div class="nav-section-label">Export</div>
      <button class="nav-link" onclick="downloadExcel()">
        <span class="nav-icon">📥</span> Download Excel
      </button>
      <button class="nav-link" onclick="downloadBackup()">
        <span class="nav-icon">🗜️</span> Complete Backup
      </button>
    </nav>
    <div class="sidebar-footer">
      <form method="POST" action="/admin/logout">
        <button type="submit" class="btn-logout">
          <span>🔓</span> Sign Out
        </button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div>
        <div class="topbar-title">All Submissions</div>
        <div class="topbar-meta">Search, filter, and review bartender registrations</div>
      </div>
      <div>
        <button class="btn btn-primary" onclick="downloadExcel()" style="font-size:0.8rem;padding:8px 16px;">
          📥 Export Excel
        </button>
      </div>
    </header>

    <main class="page-content">

      <!-- Filters -->
      <div class="filters-card">
        <div class="filters-grid">
          <div class="filter-group">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Name, outlet, or Instagram handle…" />
          </div>
          <div class="filter-group">
            <label for="dateFrom">Date From</label>
            <input type="date" id="dateFrom" />
          </div>
          <div class="filter-group">
            <label for="dateTo">Date To</label>
            <input type="date" id="dateTo" />
          </div>
          <div class="filter-group">
            <label for="limitSel">Per Page</label>
            <select id="limitSel">
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
        <div class="filters-actions">
          <button class="btn btn-primary" onclick="applyFilters()">🔍 Search</button>
          <button class="btn btn-secondary" onclick="clearFilters()">✕ Clear</button>
          <button class="btn btn-secondary" onclick="downloadExcel()">📥 Download Excel</button>
          <button class="btn btn-secondary" onclick="downloadBackup()">🗜️ Download Backup</button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="table-header">
          <div>
            <div class="table-title">Submission Records</div>
            <div class="table-count" id="tableCount">Loading…</div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="dataTable">
            <thead>
              <tr>
                <th>#</th>
                <th>ID</th>
                <th>Name</th>
                <th>Outlet</th>
                <th>Instagram</th>
                <th>Testimonial</th>
                <th>Date</th>
                <th>Time</th>
                <th>Device</th>
                <th>Status</th>
                <th>Signature</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="11"><div class="loading-state"><div class="spinner"></div> Loading…</div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="paginationWrap" style="display:none;">
          <div class="pagination-info" id="paginationInfo"></div>
          <div class="pagination-controls" id="paginationControls"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="detailModal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalName">Details</h2>
        <button class="modal-close" onclick="closeModalBtn()">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentPage = 1;
    let currentLimit = 20;
    let totalPages = 1;

    function showToast(msg, d = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), d);
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function buildUrl() {
      const p = new URLSearchParams();
      p.set('page', currentPage);
      p.set('limit', document.getElementById('limitSel').value);
      const s = document.getElementById('searchInput').value.trim();
      if (s) p.set('search', s);
      const df = document.getElementById('dateFrom').value;
      if (df) p.set('dateFrom', df);
      const dt = document.getElementById('dateTo').value;
      if (dt) p.set('dateTo', dt);
      return '/admin/api/submissions?' + p.toString();
    }

    async function loadSubmissions() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '<tr><td colspan="11"><div class="loading-state"><div class="spinner"></div> Loading…</div></td></tr>';

      try {
        const r = await fetch(buildUrl(), { credentials: 'include' });
        const data = await r.json();
        const subs = data.submissions || [];
        const pg = data.pagination || {};
        totalPages = pg.totalPages || 1;

        document.getElementById('tableCount').textContent =
          `${pg.total || 0} total submission${pg.total !== 1 ? 's' : ''}`;

        if (subs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11"><div class="loading-state" style="color:var(--text-dim)">No submissions found.</div></td></tr>';
          document.getElementById('paginationWrap').style.display = 'none';
          return;
        }

        const offset = (currentPage - 1) * parseInt(document.getElementById('limitSel').value);
        tbody.innerHTML = subs.map((s, i) => `
          <tr onclick="openModal('${escHtml(s.submissionId)}')" style="cursor:pointer;">
            <td style="color:var(--text-dim)">${offset + i + 1}</td>
            <td style="font-family:monospace;font-size:0.75rem;color:var(--text-dim)">${escHtml(s.submissionId.slice(0,8))}…</td>
            <td><strong>${escHtml(s.name)}</strong></td>
            <td>${escHtml(s.outletName)}</td>
            <td class="ig-handle">@${escHtml(s.instagramHandle)}</td>
            <td class="testimonial-cell" title="${escHtml(s.testimonial)}">${escHtml(s.testimonial)}</td>
            <td style="white-space:nowrap">${s.submissionDate || '—'}</td>
            <td style="white-space:nowrap;color:var(--text-muted)">${s.submissionTime || '—'}</td>
            <td style="font-family:monospace;font-size:0.75rem;color:var(--text-dim)">${escHtml((s.deviceId || '').slice(0,10))}…</td>
            <td><span class="badge badge-${s.syncStatus || 'direct'}">${s.syncStatus || 'direct'}</span></td>
            <td onclick="event.stopPropagation()">
              ${s.signatureUrl
                ? `<img src="${escHtml(s.signatureUrl)}" class="sig-thumb" alt="Sig" title="Click to view full signature" onclick="viewSig('${escHtml(s.signatureUrl)}')" />`
                : '<span style="color:var(--text-dim)">—</span>'}
            </td>
          </tr>
        `).join('');

        renderPagination(pg);
        document.getElementById('paginationWrap').style.display = 'flex';
      } catch (e) {
        tbody.innerHTML = `<tr><td colspan="11"><div class="loading-state" style="color:var(--error)">Error: ${e.message}</div></td></tr>`;
      }
    }

    function renderPagination(pg) {
      const info = document.getElementById('paginationInfo');
      const controls = document.getElementById('paginationControls');

      info.textContent = `Page ${pg.page} of ${pg.totalPages || 1}`;

      const btns = [];
      btns.push(`<button class="page-btn" onclick="goPage(${pg.page - 1})" ${!pg.hasPrev ? 'disabled' : ''}>← Prev</button>`);

      const start = Math.max(1, pg.page - 2);
      const end = Math.min(pg.totalPages || 1, pg.page + 2);
      for (let i = start; i <= end; i++) {
        btns.push(`<button class="page-btn ${i === pg.page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
      }

      btns.push(`<button class="page-btn" onclick="goPage(${pg.page + 1})" ${!pg.hasNext ? 'disabled' : ''}>Next →</button>`);
      controls.innerHTML = btns.join('');
    }

    function goPage(p) {
      if (p < 1 || p > totalPages) return;
      currentPage = p;
      loadSubmissions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function applyFilters() {
      currentPage = 1;
      loadSubmissions();
    }

    function clearFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      currentPage = 1;
      loadSubmissions();
    }

    // Search on Enter key
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') applyFilters();
    });

    // ── Modal ─────────────────────────────────────────────────────────────────

    async function openModal(submissionId) {
      try {
        const r = await fetch(`/admin/api/submissions/${submissionId}`, { credentials: 'include' });
        const data = await r.json();
        const s = data.submission;

        document.getElementById('modalName').textContent = s.name;
        document.getElementById('modalBody').innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
            <div class="modal-field">
              <div class="modal-field-label">Submission ID</div>
              <div class="modal-field-value" style="font-family:monospace;font-size:0.8rem">${escHtml(s.submissionId)}</div>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Device ID</div>
              <div class="modal-field-value" style="font-family:monospace;font-size:0.8rem">${escHtml(s.deviceId)}</div>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Outlet</div>
              <div class="modal-field-value">${escHtml(s.outletName)}</div>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Instagram</div>
              <div class="modal-field-value" style="color:var(--info)">@${escHtml(s.instagramHandle)}</div>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Date</div>
              <div class="modal-field-value">${s.submissionDate || '—'} ${s.submissionTime || ''}</div>
            </div>
            <div class="modal-field">
              <div class="modal-field-label">Status</div>
              <div class="modal-field-value"><span class="badge badge-${s.syncStatus}">${s.syncStatus}</span></div>
            </div>
          </div>
          <div class="modal-field" style="margin-bottom:20px;">
            <div class="modal-field-label">Testimonial (${s.testimonialWordCount || '?'} words)</div>
            <div class="modal-field-value" style="background:rgba(255,255,255,0.04);border:1px solid var(--border-dim);border-radius:8px;padding:14px;font-style:italic;color:var(--text-muted)">"${escHtml(s.testimonial)}"</div>
          </div>
          ${s.signatureUrl ? `
            <div class="modal-field">
              <div class="modal-field-label">Signature</div>
              <img src="${escHtml(s.signatureUrl)}" class="modal-sig-img" alt="Signature" />
              <a href="${escHtml(s.signatureUrl)}" target="_blank" style="display:inline-block;margin-top:10px;font-size:0.8rem;color:var(--gold)">Open full size ↗</a>
            </div>
          ` : ''}
        `;

        document.getElementById('modalOverlay').classList.add('open');
      } catch (e) {
        showToast('Failed to load details: ' + e.message);
      }
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').classList.remove('open');
      }
    }

    function closeModalBtn() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function viewSig(url) {
      window.open(url, '_blank');
    }

    // ── Exports ───────────────────────────────────────────────────────────────

    function downloadExcel() {
      showToast('Preparing Excel download… This may take a moment.');
      window.location.href = '/api/export/excel';
    }

    function downloadBackup() {
      showToast('Preparing backup ZIP… Please wait.');
      window.location.href = '/api/export/backup';
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    loadSubmissions();
  </script>
</body>
</html>
